name: CI

# Runs on every push and PR, from any contributor or automated agent
# (several agents/sessions push directly to `main` on this repo with no
# branch protection) — the goal is a fast, always-green-or-honestly-red
# signal that a change compiles and type-checks before it lands, since
# right now nothing stands between a typo and a broken production deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    # `next build` runs generateStaticParams on several routes
    # (listing/[slug], project/[slug], projects/[slug], developer/[slug]),
    # which hits the real database at build time — this job needs
    # DATABASE_URL / AUTH_SECRET / BLOB_READ_WRITE_TOKEN / NEXT_PUBLIC_MAPBOX_TOKEN
    # added as repo secrets (Settings -> Secrets and variables -> Actions),
    # *and* a repo Variable `CI_BUILD_ENABLED=true` (Settings -> Secrets
    # and variables -> Actions -> Variables) to switch this job on. Job-
    # level `if:` can't reference `secrets` directly (that's a hard
    # GitHub Actions parse error, not just a false condition — confirmed
    # live: the first version of this workflow that tried it failed
    # instantly with zero jobs run), so a plain repo Variable is the gate
    # instead. Skipped (not failing) until that variable is set.
    if: ${{ vars.CI_BUILD_ENABLED == 'true' }}
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
